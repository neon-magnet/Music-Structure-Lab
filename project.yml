# XcodeGen 用のプロジェクト定義。`xcodegen generate` で MusicStructureLab.xcodeproj を生成する。
# Swift Package (Package.swift) と同じソースを使い、サンドボックス付きの .app バンドルとしてビルドする。
name: MusicStructureLab
options:
  bundleIdPrefix: app.musicstructurelab
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  MSLCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/MSLCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.musicstructurelab.MSLCore
        # 解析・パート分離は計算量が多いので、Debug ビルドでも最適化する。
        SWIFT_OPTIMIZATION_LEVEL: "-O"
  MSLAudio:
    type: framework
    platform: macOS
    sources:
      - path: Sources/MSLAudio
    dependencies:
      - target: MSLCore
      - sdk: AVFoundation.framework
      - sdk: CoreML.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.musicstructurelab.MSLAudio
  MusicStructureLab:
    type: application
    platform: macOS
    sources:
      - path: Sources/MusicStructureLab
    dependencies:
      - target: MSLCore
      - target: MSLAudio
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Music Structure Lab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
          - CFBundleTypeName: Music Structure Lab Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - app.musicstructurelab.project
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.musicstructurelab.project
            UTTypeDescription: Music Structure Lab Project
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mslab
    entitlements:
      path: App/MusicStructureLab.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_NAME: Music Structure Lab
        PRODUCT_BUNDLE_IDENTIFIER: app.musicstructurelab.MusicStructureLab
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
    scheme: {}
